<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DICOM 批处理{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
           margin: 0; background: #f5f7fa; color: #1f2933; }
    header { background: #1f3a5f; color: #fff; padding: 16px 28px; }
    header a { color: #cfe0ff; text-decoration: none; }
    main { max-width: 1080px; margin: 24px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #e1e6ee; border-radius: 10px;
            padding: 22px 26px; margin-bottom: 22px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #dce2ea; padding: 7px 10px; text-align: left;
             word-break: break-all; }
    th { background: #eef2f8; }
    .status-ready { color: #1a7f37; font-weight: 600; }
    .status-failed { color: #b42318; font-weight: 600; }
    .status-processing { color: #b26a00; font-weight: 600; }
    .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .flash.error { background: #fde8e8; border: 1px solid #f5b5b5; color: #8a1c1c; }
    .flash.ok { background: #e6f6ec; border: 1px solid #9fd8b2; color: #175e31; }
    .btn { display: inline-block; background: #1f6feb; color: #fff; padding: 9px 18px;
           border-radius: 7px; text-decoration: none; border: 0; cursor: pointer;
           font-size: 14px; }
    .btn:disabled { background: #9db8e8; cursor: not-allowed; }
    code { background: #f0f2f6; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .muted { color: #667085; font-size: 12px; }
  </style>
</head>
<body>
<header>
  <h1 style="margin:0;font-size:20px;">DICOM 影像批处理（匿名化 / 重标识）</h1>
  <div style="margin-top:6px;"><a href="{{ url_for('index') }}">← 返回批次列表</a></div>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
